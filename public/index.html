<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta
      name="description"
      content="Portfolio de Hubert Joseph KUISSODE, développeur web fullstack (React, PHP, WordPress)."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>KUISSODE Hubert Joseph | Développeur Fullstack</title>
    <style>
      body { margin: 0; background: #1a1a1a; }
      html[data-theme="light"] body { background: #ffffff; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1rem;
        text-align: center;
        background: #1a1a1a;
        font-family: 'Roboto', Arial, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      html[data-theme="light"] #splash { background: #ffffff; }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      .splash-last {
        margin: 0;
        font-size: clamp(2.4rem, 10vw, 5rem);
        font-weight: 900;
        letter-spacing: 3px;
        line-height: 1.1;
        color: #ffffff;
        opacity: 0;
        animation: splashUp 0.9s 0.2s ease forwards;
      }
      html[data-theme="light"] .splash-last { color: #18181a; }
      .splash-first {
        margin: 0;
        font-size: clamp(1.7rem, 7.5vw, 3.4rem);
        font-weight: 800;
        line-height: 1.1;
        background: linear-gradient(90deg, #3b82f6, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        animation: splashUp 0.9s 0.9s ease forwards;
      }
      .splash-role {
        margin: 0.9rem 0 0;
        font-size: clamp(0.85rem, 3.4vw, 1.2rem);
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #3b82f6;
        opacity: 0;
        animation: splashUp 0.9s 1.6s ease forwards;
      }
      .splash-progress {
        margin-top: 2rem;
        width: min(220px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: rgba(128, 128, 128, 0.25);
        overflow: hidden;
      }
      .splash-progress span {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3b82f6, #22d3ee);
        transform: scaleX(0);
        transform-origin: left;
        animation: splashFill 5s linear forwards;
      }
      @keyframes splashUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashFill {
        to { transform: scaleX(1); }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme-choice");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="splash" aria-label="KUISSODE Hubert Joseph">
      <div class="splash-last">KUISSODE</div>
      <div class="splash-first">Hubert Joseph</div>
      <div class="splash-role" id="splash-role">Développeur Fullstack</div>
      <div class="splash-progress"><span></span></div>
    </div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("language") === "en") {
            document.getElementById("splash-role").textContent = "Fullstack Developer";
          }
        } catch (e) {}
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
